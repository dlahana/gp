[project]
name = "labpicker"
version = "0.1.0"
description = "Shared chemical master list, test log, and explore/exploit compound picker"
requires-python = ">=3.9"
dependencies = ["pandas", "numpy", "rdkit"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
labpicker = "labpicker.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["labpicker"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dart-concentration-gradient"
version = "0.1.0"
description = "1D vapor-transport simulator for a diffusion tube (assay design + delivery features)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
props = ["chemicals", "thermo", "rdkit", "pyyaml", "pandas"]
app = ["streamlit", "plotly", "pandas"]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

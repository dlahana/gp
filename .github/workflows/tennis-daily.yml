name: Daily tennis predictions

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC every day
  workflow_dispatch:
    inputs:
      date:
        description: "Date to predict (YYYY-MM-DD, blank = today)"
        required: false
      post:
        description: "Post to X"
        type: boolean
        default: false

jobs:
  predict:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tour: [atp]          # add wta to post a second daily thread
    defaults:
      run:
        working-directory: tennis
    env:
      TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tennis/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore match data
        uses: actions/cache@v4
        with:
          path: tennis/data
          key: tennis-data-${{ matrix.tour }}-${{ github.run_id }}
          restore-keys: tennis-data-${{ matrix.tour }}-

      - name: Refresh match data
        run: python -m tennispred download --tour ${{ matrix.tour }} --start-year 1985

      - name: Predict (and post when enabled)
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_POST: ${{ inputs.post }}
          POST_TO_X: ${{ vars.POST_TO_X }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS="--tour ${{ matrix.tour }} --fixtures api --retrain --model models/${{ matrix.tour }}.json"
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
          # Scheduled runs post only when the repo variable POST_TO_X is "true";
          # manual runs post only when the "post" box is ticked.
          if [ "$EVENT" = "schedule" ] && [ "$POST_TO_X" = "true" ]; then ARGS="$ARGS --post"; fi
          if [ "$INPUT_POST" = "true" ]; then ARGS="$ARGS --post"; fi
          python -m tennispred predict $ARGS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: predictions-${{ matrix.tour }}-${{ github.run_id }}
          path: |
            tennis/predictions/
            tennis/models/
          if-no-files-found: ignore
